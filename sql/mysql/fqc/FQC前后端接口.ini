接口3：abb/api/v1/fqc/switch-cabinets/batch-update

请求方式：PATCH （请求体以对象的格式传给后端不要数组格式）

前端对开关柜进行员工指派：
{
  "ids": [
    0
  ],   // 必传：告诉后端修改的是哪条记录
  "functionEmpNames": [
    "string"
  ],  // 指派后的功能员工ID--必填  如果前端按x按钮删除对应员工的sn_code
  "areas": [
    "string"
  ]  // 指派后的区域--必填 其他参数可选填
}
例如：
{
  "ids": [
    1,
    2,
    3
  ],
  "functionEmpNames": [
    "张三",
    "李四",
    "小五"
  ],
  "areas": [
    "A1",
    "A2",
    "A3"
  ]
}

后端返回给前端：
{
  "code": 200,
  "msg": "保存成功"
}


