***员工考勤记录表：
接口5：abb/api/v1/fqc/attendance-records
请求方式：get
前端向后端发送查看员工考勤状态请求：
{
  "pageNum": 1,                         // 当前页码 -必填
  "pageSize": 10,                       // 每页条数--必填

  //以下参数可选进行搜索
  "empId"(string): //员工id
  "empTeam"(string) //组员组别A/B/C/D 
  "empName"(taskType): //员工姓名
  "amState"(integer($int32)): 1, //状态:1-在岗 2-FAT 3-耐压 4-请假 5-离职 *******
  "pmState"(integer($int32)): 2, //*******
  "recordDate"(string($date)): //考勤日期（不传默认当天--前端传入具体日期 ：查询指定日期的考勤记录）*******
  "state"(integer($int32)):  //员工状态:1-在岗 2-FAT 3-耐压 4-请假 5-离职  
}

后端返回给前端:
{
  "code": "200",
  "data": {
    "list": [
      {
        "id": "1",
        "empId": "15700848",  //员工id
        "empTeam": "A", //员工组别
        "empName": "唐献阳", //员工姓名
        "amState": 1, //状态:1-在岗 2-FAT 3-耐压 4-请假 5-离职
        "pmState": 2, 
        "recordDate": "2026-07-13" //考勤日期 *********
        "createTime": "2026-07-06 17:18:37",
        "updateTime": "2026-07-06 17:18:47"
      }
    ],
    "total": 1
  },
  "msg": "操作成功"
}


接口6：abb/api/v1/fqc/switch-cabinets/update

请求方式：PATCH （支持单条和批量员工状态修改）

前端对开关柜进行员工状态进行修改：
PATCH /api/v1/fqc/attendance-records/state
Content-Type: application/json

{
  "items": [
    {
      "empId": "15700848",
      "amState": 1, //状态:1-在岗 2-FAT 3-耐压 4-请假 5-离职 ******
      "pmState": 2,  //状态:1-在岗 2-FAT 3-耐压 4-请假 5-离职 ******
      "recordDate": "" //**考勤日期(不传则默认今天)*********
    },
    {
      "empId": "15700866",
      "amState": 3,
      "pmState": 3,
      "recordDate": ""
    }
  ]
}


{
  "code": "200",
  "data": null,
  "msg": "操作成功"
}







